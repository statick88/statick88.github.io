allowBuilds:
  esbuild: true

# Same-major security floors for transitive dependencies retained by upstream
# lockfile resolutions. Keep local and CI audits unsuppressed; remove a floor
# only when every parent resolves to an equally safe release without it.
overrides:
  brace-expansion@1: ^1.1.21
  postcss@8: ^8.5.23
  undici@7: ^7.30.1
  nanoid@3: ^3.3.18
  browserslist@4: ^4.28.7
  baseline-browser-mapping@2: ^2.11.0
  source-map-js@1: ^1.2.2
  postcss-selector-parser@6: ^6.1.5
