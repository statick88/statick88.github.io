name = "cv-diego"
compatibility_date = "2024-06-26"
pages_build_output_dir = "dist"

[build]
command = "npm install && npm run build"
cwd = "."

# ── Security Headers ──────────────────────────────────────────────
# CSP is generated by scripts/generate-csp.mjs during build and written
# to _headers (Cloudflare Pages) and <meta> (GitHub Pages).
# Do NOT duplicate CSP here — _headers is the source of truth.
#
# These non-CSP headers are set as defense-in-depth only.

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/*.pdf"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
